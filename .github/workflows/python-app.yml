name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: testing

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d finance_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: make install

      - name: Run linter
        run: make lint

      - name: Run tests with coverage
        run: make test-cov
        env:
          SECRET_KEY: test-secret-key-for-ci
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_test
          YOOKASSA_SHOP_ID: test-shop-id
          YOOKASSA_SECRET_KEY: test-yookassa-secret-key
          YOOKASSA_RETURN_URL: http://test/payment/return

          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_test
          DEBUG: "false"
          DUMMY_HASH: $argon2id$v=19$m=65536,t=3,p=4$azNali8e7g+jj0Ecxt8CPg$buwh9p9FplclNYf8rc5DL2bxru3CIPXpmtdGATIPye8

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}