[project]
name = "finance-accounting-exp"
version = "0.1.0"
description = "API для вебсервиса финансового учета"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.14.0",
    "yookassa>=3.12.1",
    "httpx2>=2.13.1",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "asgi-lifespan>=2.1.0",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."
path_separator = "os"

[tool.coverage.report]
fail_under = 60.0

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"] # Игнорировать длину строки (доверяем форматтеру)

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"